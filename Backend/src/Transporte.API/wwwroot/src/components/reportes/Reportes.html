                <!-- VISTA: MÓDULO DE REPORTES INTEGRAL (EXACTO A CAPTURAS) -->
                <section id="tab-reportes" class="tab-content">
                    <!-- ENCABEZADO DE INFORMACIÓN GENERAL -->
                    <div class="report-header-banner">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div class="banner-icon-badge"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                            <div>
                                <h2
                                    style="font-size: 16px; font-weight: 800; letter-spacing: 0.5px; margin: 0; color: #fff;">
                                    INFORMACI&Oacute;N GENERAL / REPORTES</h2>
                                <span style="font-size: 12px; color: #cbd5e1; font-weight: 500;">Generación de balances,
                                    nómina bancaria y resumen de recolección</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                            <button type="button" class="btn btn-sm btn-outline" id="btnImprimirReporte"
                                onclick="imprimirReporteActual()"
                                style="border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25);">
                                <i class="fa-solid fa-print"></i> Imprimir / PDF
                            </button>
                            <button type="button" class="btn btn-sm btn-success" id="btnExportarExcelReporte"
                                onclick="exportarReporteActualExcel()"
                                style="border-radius: 8px; padding: 7px 16px; font-size: 13px; font-weight: 700; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);">
                                <i class="fa-solid fa-file-excel"></i> Exportar
                            </button>
                        </div>
                    </div>

                    <!-- PANEL BUSCAR REPORTES -->
                    <div class="content-card" style="margin-bottom: 20px; padding: 0; overflow: visible;">
                        <div class="card-header-styled card-header-primary">
                            <span><i class="fa-solid fa-magnifying-glass"></i> PAR&Aacute;METROS DE
                                B&Uacute;SQUEDA</span>
                            <span id="badgeSemanaReporteActual" class="badge badge-info"
                                style="font-size: 11.5px; font-weight: 700;">Semana Operativa</span>
                        </div>

                        <div style="padding: 18px;">
                            <!-- FILA 1: DESDE, HASTA, TIPO, BOTÓN BUSCAR -->
                            <div
                                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) 130px; gap: 16px; align-items: flex-end; margin-bottom: 14px;">
                                <div>
                                    <label for="reporteFechaDesde"
                                        style="font-size: 13px; color: #1e293b; font-weight: 700; display: block; margin-bottom: 6px;">Desde:</label>
                                    <input type="date" id="reporteFechaDesde" class="form-input"
                                        style="height: 42px; font-size: 14px; font-weight: 600; color: #0f172a;"
                                        onchange="onCambiarFechaReporteManual()">
                                </div>
                                <div>
                                    <label for="reporteFechaHasta"
                                        style="font-size: 13px; color: #1e293b; font-weight: 700; display: block; margin-bottom: 6px;">Hasta:</label>
                                    <input type="date" id="reporteFechaHasta" class="form-input"
                                        style="height: 42px; font-size: 14px; font-weight: 600; color: #0f172a;"
                                        onchange="onCambiarFechaReporteManual()">
                                </div>
                                <div>
                                    <label for="searchReporteTipoInput"
                                        style="font-size: 13px; color: #1e293b; font-weight: 700; display: block; margin-bottom: 6px;">Tipo
                                        de Reporte:</label>
                                    <div class="searchable-select" id="comboboxReporteTipo" style="position: relative;">
                                        <input type="hidden" id="reporteTipoSelect" value="DIARIOS">
                                        <div class="combobox-input-wrapper"
                                            style="position: relative; display: flex; align-items: center;">
                                            <input type="text" class="form-input combobox-search"
                                                id="searchReporteTipoInput" placeholder="Buscar tipo de reporte..."
                                                autocomplete="off"
                                                style="height: 42px; font-weight: 700; font-size: 13.5px; padding-right: 34px; color: #0f172a;"
                                                value="DIARIOS">
                                            <i class="fa-solid fa-chevron-down combobox-chevron"
                                                style="position: absolute; right: 12px; color: #64748b; pointer-events: none;"></i>
                                        </div>
                                        <div class="combobox-dropdown" id="dropdownReporteTipoList"
                                            style="display: none;"></div>
                                    </div>
                                </div>
                                <div>
                                    <button type="button" class="btn btn-primary" id="btnEjecutarReporte"
                                        onclick="ejecutarBusquedaReporte()"
                                        style="height: 42px; width: 100%; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px;">
                                        <i class="fa-solid fa-magnifying-glass"></i> Buscar
                                    </button>
                                </div>
                            </div>

                            <!-- FILA 2: SUB-FILTROS DINÁMICOS CON BUSCADORES / COMBOBOXES -->
                            <div id="contenedorSubFiltrosReporte"
                                style="padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); display: none;">

                                <!-- Subfiltro Receptoría con buscador de texto y selector de Tipo de Servicio -->
                                <div id="subFiltroReceptoria"
                                    style="display: none; width: 100%; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; align-items: flex-end;">
                                    <div>
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">
                                            <i class="fa-solid fa-truck" style="color: #10b981;"></i> Receptor&iacute;a
                                            / Planta:
                                        </label>
                                        <div class="searchable-select" id="comboboxReporteReceptoria"
                                            style="position: relative;">
                                            <input type="hidden" id="reporteSubSelectReceptoria" value="">
                                            <div class="combobox-input-wrapper"
                                                style="position: relative; display: flex; align-items: center;">
                                                <input type="text" class="form-input combobox-search"
                                                    id="searchReporteReceptoriaInput"
                                                    placeholder="Escriba para buscar Receptoría / Planta..."
                                                    autocomplete="off"
                                                    style="height: 42px; font-size: 14px; font-weight: 600; padding-right: 34px; color: #0f172a;">
                                                <i class="fa-solid fa-chevron-down combobox-chevron"
                                                    style="position: absolute; right: 12px; color: #64748b; pointer-events: none;"></i>
                                            </div>
                                            <div class="combobox-dropdown" id="dropdownReporteReceptoriaList"
                                                style="display: none;"></div>
                                        </div>
                                    </div>
                                    <div id="contenedorFiltroTipoServicioReporte" style="display: none;">
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">
                                            <i class="fa-solid fa-layer-group" style="color: #7c3aed;"></i> Tipo de
                                            Servicio Compañías:
                                        </label>
                                        <select id="reporteSelectTipoServicio" class="form-input"
                                            style="height: 42px; font-size: 13.5px; font-weight: 700; color: #0f172a; border-radius: 8px;"
                                            onchange="filtrarVistaServicioCompania(this.value)">
                                            <option value="TODOS">TODOS LOS SERVICIOS (TRANSPORTE Y RUTA)</option>
                                            <option value="TRANSPORTE">SOLO SERVICIO DE TRANSPORTE (FLETES)</option>
                                            <option value="RUTA">SOLO SERVICIO DE RUTA (VENTA DE LECHE)</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Subfiltro Fincas con buscadores de texto interactivos (Finca 1 y Finca 2) -->
                                <div id="subFiltroFincas"
                                    style="display: none; grid-template-columns: 1fr 1fr; gap: 22px;">
                                    <div>
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">
                                            <i class="fa-solid fa-cow" style="color: #2563eb;"></i> Finca 1 (Buscar por
                                            nombre o dueño):
                                        </label>
                                        <div class="searchable-select" id="comboboxReporteFinca1"
                                            style="position: relative;">
                                            <input type="hidden" id="reporteSubSelectFinca1" value="">
                                            <div class="combobox-input-wrapper"
                                                style="position: relative; display: flex; align-items: center;">
                                                <input type="text" class="form-input combobox-search"
                                                    id="searchReporteFinca1Input"
                                                    placeholder="Escriba para buscar Finca 1..." autocomplete="off"
                                                    style="height: 42px; font-size: 14px; font-weight: 600; padding-right: 34px; color: #0f172a;">
                                                <i class="fa-solid fa-chevron-down combobox-chevron"
                                                    style="position: absolute; right: 12px; color: #64748b; pointer-events: none;"></i>
                                            </div>
                                            <div class="combobox-dropdown" id="dropdownReporteFinca1List"
                                                style="display: none;"></div>
                                        </div>
                                    </div>
                                    <div>
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">
                                            <i class="fa-solid fa-cow" style="color: #10b981;"></i> Finca 2 (Opcional -
                                            Comparar):
                                        </label>
                                        <div class="searchable-select" id="comboboxReporteFinca2"
                                            style="position: relative;">
                                            <input type="hidden" id="reporteSubSelectFinca2" value="">
                                            <div class="combobox-input-wrapper"
                                                style="position: relative; display: flex; align-items: center;">
                                                <input type="text" class="form-input combobox-search"
                                                    id="searchReporteFinca2Input"
                                                    placeholder="Escriba para buscar Finca 2..." autocomplete="off"
                                                    style="height: 42px; font-size: 14px; font-weight: 600; padding-right: 34px; color: #0f172a;">
                                                <i class="fa-solid fa-chevron-down combobox-chevron"
                                                    style="position: absolute; right: 12px; color: #64748b; pointer-events: none;"></i>
                                            </div>
                                            <div class="combobox-dropdown" id="dropdownReporteFinca2List"
                                                style="display: none;"></div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Subfiltro Chofer y Finca con buscadores interactivos -->
                                <div id="subFiltroChofer"
                                    style="display: none; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                                    <div>
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">
                                            <i class="fa-solid fa-id-badge" style="color: #0284c7;"></i> Conductor /
                                            Chofer (Opcional):
                                        </label>
                                        <div class="searchable-select" id="comboboxReporteChofer"
                                            style="position: relative;">
                                            <input type="hidden" id="reporteSubSelectChofer" value="">
                                            <div class="combobox-input-wrapper"
                                                style="position: relative; display: flex; align-items: center;">
                                                <input type="text" class="form-input combobox-search"
                                                    id="searchReporteChoferInput"
                                                    placeholder="Todos los choferes o escriba para buscar..."
                                                    autocomplete="off"
                                                    style="height: 42px; font-size: 14px; font-weight: 600; padding-right: 34px; color: #0f172a;">
                                                <i class="fa-solid fa-chevron-down combobox-chevron"
                                                    style="position: absolute; right: 12px; color: #64748b; pointer-events: none;"></i>
                                            </div>
                                            <div class="combobox-dropdown" id="dropdownReporteChoferList"
                                                style="display: none;"></div>
                                        </div>
                                    </div>
                                    <div>
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">
                                            <i class="fa-solid fa-cow" style="color: #2563eb;"></i> Filtrar por Finca
                                            (Opcional):
                                        </label>
                                        <div class="searchable-select" id="comboboxReporteChoferFinca"
                                            style="position: relative;">
                                            <input type="hidden" id="reporteSubSelectChoferFinca" value="">
                                            <div class="combobox-input-wrapper"
                                                style="position: relative; display: flex; align-items: center;">
                                                <input type="text" class="form-input combobox-search"
                                                    id="searchReporteChoferFincaInput"
                                                    placeholder="Todas las fincas o escriba para buscar..."
                                                    autocomplete="off"
                                                    style="height: 42px; font-size: 14px; font-weight: 600; padding-right: 34px; color: #0f172a;">
                                                <i class="fa-solid fa-chevron-down combobox-chevron"
                                                    style="position: absolute; right: 12px; color: #64748b; pointer-events: none;"></i>
                                            </div>
                                            <div class="combobox-dropdown" id="dropdownReporteChoferFincaList"
                                                style="display: none;"></div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Subfiltro Bancos -->
                                <div id="subFiltroBancos"
                                    style="display: none; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; align-items: flex-end;">
                                    <div>
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">Filtrar
                                            por Banco:</label>
                                        <select id="reporteSubSelectBanco" class="form-input"
                                            style="height: 42px; font-size: 14px; font-weight: 600; color: #0f172a;"
                                            onchange="ejecutarBusquedaReporte()">
                                            <option value="">TODOS LOS BANCOS</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label
                                            style="font-size: 13px; color: #1e293b; margin-bottom: 6px; display: block; font-weight: 700;">Tasa
                                            BCV:</label>
                                        <input type="number" step="0.0001" id="reporteInputTasaBcvManual"
                                            class="form-input" placeholder="Tasa BCV del día..."
                                            style="height: 42px; font-size: 14px; font-weight: 700; color: #047857;"
                                            onchange="ejecutarBusquedaReporte()">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- CONTENEDOR DINÁMICO DE RESULTADOS DEL REPORTE -->
                    <div id="contenedorResultadoReporte" style="min-height: 250px;">
                        <div
                            style="text-align: center; padding: 40px; color: #94a3b8; background: rgba(15, 23, 42, 0.5); border-radius: 10px; border: 1px dashed rgba(255,255,255,0.1);">
                            <i class="fa-solid fa-file-invoice"
                                style="font-size: 40px; margin-bottom: 12px; opacity: 0.4; color: #38bdf8; display: block;"></i>
                            Seleccione el tipo de reporte, rango de fechas y presione <strong>Buscar</strong> para
                            generar el reporte.
                        </div>
                    </div>
                </section>
