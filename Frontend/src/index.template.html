    <meta name="theme-color" content="#f8fafc">
    <script>
        // Silenciar errores inofensivos de extensiones externas del navegador (ej: Web Vitals / reportAllChanges / startTime)
        window.addEventListener('error', function (event) {
            if (event && event.message && (event.message.includes('startTime') || event.message.includes('reportAllChanges'))) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return true;
            }
        }, true);
    </script>

<body>
    <div id="app" style="display: none;">
        <!-- BARRA SUPERIOR -->
        <!-- BARRA DE MEN  HORIZONTAL (DISE  REQUERIDO) -->
        <!-- BARRA SUPERIOR -->
        <header class="top-nav">
            <div class="nav-left" style="display: flex; align-items: center; gap: 10px;">
                <button class="mobile-menu-toggle" id="btnToggleMobileSidebar" onclick="toggleMobileSidebar()"
                    aria-label="Abrir Menú" title="Menú">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="brand-logo" style="display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-cow brand-icon"></i>
                    <div>
                        <span class="brand-title">RUTAS DE LECHE</span>
                    </div>
                </div>
            </div>

            <div class="nav-center">
                <!-- WIDGET TASA BCV HOY -->
                <div class="bcv-widget" id="bcvWidget">
                    <div class="bcv-icon"><i class="fa-solid fa-dollar-sign"></i></div>
                    <div class="bcv-info">
                        <span class="bcv-label">TASA BCV HOY</span>
                        <span class="bcv-value" id="bcvHoyTexto">Cargando...</span>
                    </div>
                    <button class="btn-icon" id="btnSyncBcvApi"
                        title="Consultar y registrar tasa oficial en vivo desde DolarAPI"
                        style="color: #34d399; margin-left: 4px;">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </button>
                    <button class="btn-icon" id="btnEditarBcv" title="Ingresar tasa manualmente">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                </div>

                <!-- WIDGET SEMANA OPERATIVA -->
                <div class="ciclo-widget" id="cicloWidget">
                    <i class="fa-regular fa-calendar-check ciclo-icon"></i>
                    <div>
                        <span class="ciclo-label">SEMANA OPERATIVA ACTIVA</span>
                        <span class="ciclo-value" id="cicloActivoTexto">Cargando...</span>
                    </div>
                </div>
            </div>

            <div class="nav-right" style="display: flex; align-items: center; gap: 10px;">
                <!-- CENTRO DE NOTIFICACIONES & ALERTAS -->
                <div class="notif-wrapper" style="position: relative;">
                    <button class="btn-icon" id="btnNotificacionesHeader" onclick="toggleDropdownNotificaciones(event)"
                        title="Centro de Notificaciones y Alertas"
                        style="color: #f59e0b; position: relative; width: 40px; height: 40px; border-radius: 10px; background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.25); display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all 0.2s;">
                        <i class="fa-solid fa-bell"></i>
                        <span id="badgeNotificaciones"
                            style="display: none; position: absolute; top: -4px; right: -4px; background: #ef4444; color: #fff; font-size: 10px; font-weight: 800; border-radius: 10px; padding: 2px 6px; border: 2px solid #0f172a; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">0</span>
                    </button>
                    <!-- DROPDOWN NOTIFICACIONES -->
                    <div id="dropdownNotificaciones"
                        style="display: none; position: absolute; right: 0; top: calc(100% + 8px); width: 340px; max-height: 420px; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); z-index: 1000; overflow: hidden; backdrop-filter: blur(12px);">
                        <div
                            style="padding: 12px 16px; background: linear-gradient(135deg, #1e293b, #0f172a); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;">
                            <span
                                style="font-size: 13.5px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px;">
                                <i class="fa-solid fa-bell" style="color: #f59e0b;"></i> Alertas &amp; Notificaciones
                            </span>
                            <span id="lblTotalAlertasHeader" class="badge badge-warning"
                                style="font-size: 11px; padding: 2px 8px;">0 Alertas</span>
                        </div>
                        <div id="listaNotificacionesContenido"
                            style="padding: 10px; max-height: 330px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                            <div style="text-align: center; padding: 20px 10px; color: #94a3b8; font-size: 12.5px;">
                                <i class="fa-solid fa-bell-slash"
                                    style="font-size: 24px; margin-bottom: 6px; display: block; opacity: 0.5;"></i>
                                No hay alertas pendientes por resolver
                            </div>
                        </div>
                    </div>
                </div>

                <div class="user-profile" id="userProfileWidget">
                    <div class="user-avatar" id="userAvatar">AD</div>
                    <div class="user-details">
                        <span class="user-name" id="userNameLabel">Administrador</span>
                        <span class="user-role" id="userRoleBadge">ADMIN</span>
                    </div>
                    <button class="btn-icon btn-config-gear" id="btnConfigSesionHeader"
                        onclick="abrirModalConfiguracionSesion(event)" title="Configurar Tiempo de Sesión"
                        style="color: #94a3b8; font-size: 15px; margin-right: 4px;">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <button class="btn-logout" id="btnLogout" title="Cerrar Sesión">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Salir</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- CONTENEDOR PRINCIPAL CON MEN LATERAL -->
        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar(false)"></div>
        <div class="main-layout"
            style="display: flex; flex-direction: row; width: 100%; height: calc(100vh - 65px); overflow: hidden;">
            <!-- SIDEBAR LATERAL TIPO ACORDEÓN (DESPLIEGUE POR HOVER Y CLIC ACTIVO) -->
            <aside class="sidebar hover-accordion-sidebar" id="mainSidebar"
                style="width: 260px; min-width: 260px; max-width: 260px; flex-shrink: 0; height: 100%; overflow-y: auto;">
